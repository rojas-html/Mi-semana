<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Semana</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   GLOBAL
═══════════════════════════════════════════ */
:root {
  --clase:    #3b6fd4;
  --estudio:  #2e8b6b;
  --gym:      #d45c2e;
  --ocio:     #9b59b6;
  --sueno:    #4a6480;
  --comida:   #b8860b;

–ingles:    #2563a8;
–metodos:   #16794a;
–caldas:    #a05c1a;
–teoria:    #7c2d8f;
–politica:  #b91c3a;
–oralidad:  #0e7490;
–fund:      #92400e;

–alta:  #dc2626;
–media: #d97706;
–baja:  #16a34a;
}

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: ‘DM Mono’, monospace;
min-height: 100vh;
background: #0f0f0f;
color: #e8e4dc;
}

/* ═══════════════════════════════════════════
TOP NAV
═══════════════════════════════════════════ */
.topnav {
display: flex;
align-items: center;
gap: 0;
background: #0a0a0a;
border-bottom: 1px solid #222;
padding: 0 28px;
position: sticky;
top: 0;
z-index: 50;
}

.app-brand {
font-family: ‘Instrument Serif’, serif;
font-size: 1.1rem;
color: #e8e4dc;
padding: 16px 0;
margin-right: 32px;
white-space: nowrap;
}

.app-brand em { font-style: italic; opacity: 0.5; }

.tab-btn {
background: none;
border: none;
font-family: ‘DM Mono’, monospace;
font-size: 0.72rem;
color: #555;
padding: 18px 20px;
cursor: pointer;
letter-spacing: 0.08em;
text-transform: uppercase;
border-bottom: 2px solid transparent;
transition: color 0.15s, border-color 0.15s;
white-space: nowrap;
}

.tab-btn:hover { color: #999; }
.tab-btn.active { color: #e8e4dc; border-bottom-color: #e8e4dc; }

/* ═══════════════════════════════════════════
PANELS
═══════════════════════════════════════════ */
.panel { display: none; }
.panel.active { display: block; }

/* ═══════════════════════════════════════════
HORARIO PANEL (dark)
═══════════════════════════════════════════ */
#panel-horario {
background: #0f0f0f;
padding: 32px 28px 60px;
}

#panel-horario header { margin-bottom: 24px; }

#panel-horario h1 {
font-family: ‘Syne’, sans-serif;
font-size: clamp(1.6rem, 3vw, 2.4rem);
font-weight: 800;
letter-spacing: -0.03em;
}

#panel-horario header p {
font-size: 0.72rem;
color: #5a5a5a;
margin-top: 4px;
letter-spacing: 0.1em;
text-transform: uppercase;
}

.legend {
display: flex;
flex-wrap: wrap;
gap: 10px;
margin-bottom: 24px;
}

.legend-item {
display: flex;
align-items: center;
gap: 7px;
font-size: 0.68rem;
letter-spacing: 0.07em;
text-transform: uppercase;
opacity: 0.8;
}

.legend-dot {
width: 9px; height: 9px;
border-radius: 3px;
flex-shrink: 0;
}

.grid-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }

.schedule {
display: grid;
grid-template-columns: 60px repeat(7, minmax(100px, 1fr));
min-width: 780px;
border: 1px solid #2a2a2a;
border-radius: 10px;
overflow: hidden;
}

.day-header {
background: #161616;
padding: 12px 8px;
text-align: center;
font-family: ‘Syne’, sans-serif;
font-size: 0.68rem;
font-weight: 700;
letter-spacing: 0.12em;
text-transform: uppercase;
color: #5a5a5a;
border-right: 1px solid #2a2a2a;
border-bottom: 2px solid #333;
}

.time-label {
grid-column: 1;
padding: 6px 8px 0;
display: flex;
align-items: flex-start;
justify-content: flex-end;
font-size: 0.6rem;
color: #5a5a5a;
border-right: 1px solid #2a2a2a;
border-bottom: 1px solid #222;
min-height: 44px;
background: #161616;
}

.cell {
min-height: 44px;
border-right: 1px solid #2a2a2a;
border-bottom: 1px solid #222;
padding: 3px;
}
.cell:last-child { border-right: none; }

.block {
border-radius: 5px;
padding: 5px 7px;
font-size: 0.62rem;
line-height: 1.35;
height: 100%;
display: flex;
flex-direction: column;
justify-content: center;
cursor: default;
transition: filter 0.15s;
user-select: none;
}
.block:hover { filter: brightness(1.15); }
.block b {
font-family: ‘Syne’, sans-serif;
font-weight: 700;
font-size: 0.66rem;
display: block;
margin-bottom: 1px;
}
.block span { opacity: 0.8; }

.clase   { background: color-mix(in srgb, var(–clase)  22%, transparent); border-left: 3px solid var(–clase);  color: color-mix(in srgb, var(–clase)  90%, white 30%); }
.estudio { background: color-mix(in srgb, var(–estudio)22%, transparent); border-left: 3px solid var(–estudio);color: color-mix(in srgb, var(–estudio)90%, white 30%); }
.gym     { background: color-mix(in srgb, var(–gym)    22%, transparent); border-left: 3px solid var(–gym);    color: color-mix(in srgb, var(–gym)    90%, white 30%); }
.ocio    { background: color-mix(in srgb, var(–ocio)   22%, transparent); border-left: 3px solid var(–ocio);   color: color-mix(in srgb, var(–ocio)   90%, white 30%); }
.sueno   { background: color-mix(in srgb, var(–sueno)  22%, transparent); border-left: 3px solid var(–sueno);  color: color-mix(in srgb, var(–sueno)  90%, white 30%); }
.comida  { background: color-mix(in srgb, var(–comida) 20%, transparent); border-left: 3px solid var(–comida); color: color-mix(in srgb, var(–comida) 80%, white 40%); }

.empty {
font-size: 0.55rem;
color: #2a2a2a;
display: flex;
align-items: center;
justify-content: center;
height: 100%;
min-height: 38px;
}

/* ═══════════════════════════════════════════
TAREAS PANEL (light)
═══════════════════════════════════════════ */
#panel-tareas {
background: #f5f2ed;
color: #1a1814;
min-height: calc(100vh - 57px);
display: none;
}

#panel-tareas.active { display: flex; }

.t-sidebar {
width: 220px;
flex-shrink: 0;
background: #1a1814;
color: #f5f2ed;
padding: 28px 18px;
display: flex;
flex-direction: column;
gap: 4px;
min-height: calc(100vh - 57px);
position: sticky;
top: 57px;
height: calc(100vh - 57px);
overflow-y: auto;
}

.t-sidebar-title {
font-family: ‘Instrument Serif’, serif;
font-size: 1.1rem;
margin-bottom: 18px;
line-height: 1.2;
}
.t-sidebar-title span { font-style: italic; opacity: 0.5; font-size: 0.8rem; display: block; font-family: ‘DM Mono’, monospace; }

.t-section {
font-size: 0.58rem;
letter-spacing: 0.15em;
text-transform: uppercase;
color: #555;
margin-top: 14px;
margin-bottom: 3px;
}

.t-filter {
background: none;
border: none;
color: #888;
font-family: ‘DM Mono’, monospace;
font-size: 0.68rem;
padding: 5px 8px;
border-radius: 5px;
cursor: pointer;
text-align: left;
display: flex;
align-items: center;
gap: 7px;
transition: all 0.12s;
}
.t-filter:hover { background: #2a2a2a; color: #fff; }
.t-filter.active { background: #f5f2ed; color: #1a1814; font-weight: 500; }

.f-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.f-cnt { margin-left: auto; background: #2a2a2a; color: #666; font-size: 0.58rem; padding: 1px 5px; border-radius: 8px; }
.t-filter.active .f-cnt { background: #e0dbd2; color: #8a8278; }

.t-main {
flex: 1;
padding: 28px 32px;
max-width: 860px;
}

.t-topbar {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 22px;
gap: 12px;
flex-wrap: wrap;
}

.t-topbar h2 {
font-family: ‘Instrument Serif’, serif;
font-size: 1.6rem;
font-weight: 400;
color: #1a1814;
}
.t-topbar h2 em { font-style: italic; color: #8a8278; }

.btn-new {
background: #1a1814;
color: #f5f2ed;
border: none;
font-family: ‘DM Mono’, monospace;
font-size: 0.7rem;
padding: 9px 16px;
border-radius: 7px;
cursor: pointer;
transition: opacity 0.15s;
}
.btn-new:hover { opacity: 0.8; }

.t-stats {
display: flex;
gap: 10px;
margin-bottom: 20px;
flex-wrap: wrap;
}

.t-stat {
background: #fefcf9;
border: 1px solid #e0dbd2;
border-radius: 7px;
padding: 10px 14px;
flex: 1;
min-width: 80px;
}
.t-stat-num { font-family: ‘Instrument Serif’, serif; font-size: 1.5rem; line-height: 1; color: #1a1814; }
.t-stat-lbl { font-size: 0.58rem; color: #8a8278; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }

.task-list { display: flex; flex-direction: column; gap: 7px; }

.task-card {
background: #fefcf9;
border: 1px solid #e0dbd2;
border-radius: 9px;
padding: 12px 14px;
display: grid;
grid-template-columns: 4px 1fr auto;
gap: 10px;
align-items: start;
transition: box-shadow 0.12s, transform 0.12s;
}
.task-card:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.07); transform: translateY(-1px); }
.task-card.entregado { opacity: 0.42; }

.t-accent { border-radius: 3px; align-self: stretch; min-height: 18px; }

.t-body { min-width: 0; }
.t-name { font-family: ‘Instrument Serif’, serif; font-size: 0.98rem; line-height: 1.3; margin-bottom: 5px; color: #1a1814; }
.t-meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }

.tag {
font-size: 0.58rem;
padding: 2px 7px;
border-radius: 20px;
letter-spacing: 0.05em;
text-transform: uppercase;
font-weight: 500;
}
.tag-mat  { background: #f0ebe3; color: #8a8278; }
.tag-tipo { background: #eef2ff; color: #4f46e5; }
.tag-alta   { background: #fef2f2; color: #dc2626; }
.tag-media  { background: #fffbeb; color: #d97706; }
.tag-baja   { background: #f0fdf4; color: #16a34a; }
.tag-bloque { background: #f5f0e8; color: #92400e; }

.t-date { font-size: 0.63rem; color: #8a8278; margin-top: 3px; }
.t-date.vhoy    { color: #dc2626; font-weight: 500; }
.t-date.vpronto { color: #d97706; }
.t-notes { font-size: 0.65rem; color: #8a8278; margin-top: 5px; line-height: 1.5; font-style: italic; }

.t-actions { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }

.status-sel {
font-family: ‘DM Mono’, monospace;
font-size: 0.6rem;
border: 1px solid #e0dbd2;
border-radius: 5px;
padding: 3px 7px;
background: #f5f2ed;
color: #1a1814;
cursor: pointer;
}

.btn-icon {
background: none; border: none;
color: #c8c2b8; cursor: pointer;
font-size: 0.72rem; padding: 2px 3px;
border-radius: 3px; transition: color 0.12s;
}
.btn-icon:hover { color: #dc2626; }

.t-empty {
text-align: center;
padding: 50px 20px;
color: #8a8278;
}
.t-empty-icon { font-size: 2rem; margin-bottom: 10px; }
.t-empty p { font-size: 0.75rem; line-height: 1.6; }

/* ═══════════════════════════════════════════
MODAL
═══════════════════════════════════════════ */
.modal-overlay {
display: none;
position: fixed;
inset: 0;
background: rgba(0,0,0,0.45);
z-index: 200;
align-items: center;
justify-content: center;
padding: 20px;
}
.modal-overlay.open { display: flex; }

.modal {
background: #fefcf9;
color: #1a1814;
border-radius: 12px;
padding: 26px;
width: 100%;
max-width: 460px;
box-shadow: 0 20px 60px rgba(0,0,0,0.25);
animation: slideUp 0.18s ease;
}
@keyframes slideUp {
from { transform: translateY(16px); opacity: 0; }
to   { transform: translateY(0);    opacity: 1; }
}

.modal h3 { font-family: ‘Instrument Serif’, serif; font-size: 1.2rem; margin-bottom: 18px; }

.fg { margin-bottom: 12px; }
.fg label { display: block; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; color: #8a8278; margin-bottom: 4px; }
.fg input, .fg select, .fg textarea {
width: 100%;
font-family: ‘DM Mono’, monospace;
font-size: 0.75rem;
border: 1px solid #e0dbd2;
border-radius: 6px;
padding: 8px 10px;
background: #f5f2ed;
color: #1a1814;
outline: none;
transition: border-color 0.12s;
}
.fg input:focus, .fg select:focus, .fg textarea:focus { border-color: #1a1814; }
.fg textarea { resize: vertical; min-height: 60px; }
.fg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.btn-cancel {
background: none; border: 1px solid #e0dbd2;
font-family: ‘DM Mono’, monospace; font-size: 0.7rem;
padding: 8px 14px; border-radius: 6px; cursor: pointer; color: #8a8278;
}
.btn-save {
background: #1a1814; color: #f5f2ed; border: none;
font-family: ‘DM Mono’, monospace; font-size: 0.7rem;
padding: 8px 18px; border-radius: 6px; cursor: pointer;
}
.btn-save:hover { opacity: 0.85; }
</style>

</head>

// ══════════════════════════════════════════
// TAREAS
// ══════════════════════════════════════════
const STORAGE_KEY = 'misemana_tareas_v1';
const MATERIA_COLORS = {
  'Inglés':'var(--ingles)', 'Métodos de Estudio':'var(--metodos)',
  'F.J. de Caldas':'var(--caldas)', 'Teoría del Lenguaje':'var(--teoria)',
  'Política y Ciudadanía':'var(--politica)', 'Oralidad':'var(--oralidad)',
  'Fund. Teórica':'var(--fund)',
};

let tasks = [];
let currentFilter = 'all';
let editingId = null;

function loadTasks() {
  try { tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { tasks = []; }
}
function saveTasks() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch {}
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.t-filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const titles = { all:'Todas las <em>tareas</em>', 'esta-semana':'Esta <em>semana</em>', pendiente:'Por <em>hacer</em>', 'en-progreso':'En <em>progreso</em>', entregado:'<em>Entregadas</em>' };
  document.getElementById('view-title').innerHTML = titles[f] || '<em>' + f + '</em>';
  renderTasks();
}

function filterTasks() {
  const now = new Date(); now.setHours(0,0,0,0);
  const we = new Date(now); we.setDate(we.getDate()+7);
  return tasks.filter(t => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'pendiente') return t.estado === 'pendiente';
    if (currentFilter === 'en-progreso') return t.estado === 'en-progreso';
    if (currentFilter === 'entregado') return t.estado === 'entregado';
    if (currentFilter === 'esta-semana') {
      if (!t.fecha) return false;
      const d = new Date(t.fecha + 'T00:00:00');
      return d >= now && d <= we;
    }
    return t.materia === currentFilter;
  }).sort((a,b) => {
    if (!a.fecha && !b.fecha) return 0;
    if (!a.fecha) return 1; if (!b.fecha) return -1;
    return new Date(a.fecha) - new Date(b.fecha);
  });
}

function dateLabel(f) {
  if (!f) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(f + 'T00:00:00');
  const diff = Math.round((d - now) / 86400000);
  const fmt = d.toLocaleDateString('es-CO', { day:'numeric', month:'short', year:'numeric' });
  if (diff < 0)  return { text: 'Venció el ' + fmt, cls: 'vhoy' };
  if (diff === 0) return { text: '⚠ Vence hoy', cls: 'vhoy' };
  if (diff === 1) return { text: '⚡ Vence mañana', cls: 'vpronto' };
  if (diff <= 5)  return { text: 'Vence en ' + diff + ' días — ' + fmt, cls: 'vpronto' };
  return { text: 'Entrega: ' + fmt, cls: '' };
}

function renderTasks() {
  const now = new Date(); now.setHours(0,0,0,0);
  const we = new Date(now); we.setDate(we.getDate()+7);

  document.getElementById('s-total').textContent = tasks.length;
  document.getElementById('s-pend').textContent  = tasks.filter(t=>t.estado==='pendiente').length;
  document.getElementById('s-prog').textContent  = tasks.filter(t=>t.estado==='en-progreso').length;
  document.getElementById('s-ent').textContent   = tasks.filter(t=>t.estado==='entregado').length;

  document.getElementById('cnt-all').textContent      = tasks.length;
  document.getElementById('cnt-semana').textContent   = tasks.filter(t=>{ if(!t.fecha)return false; const d=new Date(t.fecha+'T00:00:00'); return d>=now&&d<=we; }).length;
  document.getElementById('cnt-pendiente').textContent= tasks.filter(t=>t.estado==='pendiente').length;
  document.getElementById('cnt-progreso').textContent = tasks.filter(t=>t.estado==='en-progreso').length;
  document.getElementById('cnt-entregado').textContent= tasks.filter(t=>t.estado==='entregado').length;
  Object.keys(MATERIA_COLORS).forEach(m => {
    const el = document.getElementById('cnt-' + m);
    if (el) el.textContent = tasks.filter(t=>t.materia===m).length;
  });

  const list = document.getElementById('task-list');
  const filtered = filterTasks();
  if (!filtered.length) {
    list.innerHTML = '<div class="t-empty"><div class="t-empty-icon">📭</div><p>No hay tareas aquí.<br>Usa <strong>+ Nueva tarea</strong> para agregar.</p></div>';
    return;
  }
  list.innerHTML = filtered.map(t => {
    const color = MATERIA_COLORS[t.materia] || '#888';
    const dl = dateLabel(t.fecha);
    return '<div class="task-card ' + (t.estado==='entregado'?'entregado':'') + '">' +
      '<div class="t-accent" style="background:' + color + '"></div>' +
      '<div class="t-body">' +
        '<div class="t-name">' + t.nombre + '</div>' +
        '<div class="t-meta">' +
          (t.materia ? '<span class="tag tag-mat">' + t.materia + '</span>' : '') +
          (t.tipo    ? '<span class="tag tag-tipo">' + t.tipo + '</span>' : '') +
          (t.prioridad ? '<span class="tag tag-' + t.prioridad + '">' + (t.prioridad==='alta'?'🔴 Alta':t.prioridad==='media'?'🟡 Media':'🟢 Baja') + '</span>' : '') +
          (t.bloque  ? '<span class="tag tag-bloque">' + t.bloque + '</span>' : '') +
        '</div>' +
        (dl ? '<div class="t-date ' + dl.cls + '">' + dl.text + '</div>' : '') +
        (t.notas ? '<div class="t-notes">' + t.notas + '</div>' : '') +
      '</div>' +
      '<div class="t-actions">' +
        '<select class="status-sel" onchange="changeStatus(\'' + t.id + '\',this.value)">' +
          '<option value="pendiente"' + (t.estado==='pendiente'?' selected':'') + '>Por hacer</option>' +
          '<option value="en-progreso"' + (t.estado==='en-progreso'?' selected':'') + '>En progreso</option>' +
          '<option value="entregado"' + (t.estado==='entregado'?' selected':'') + '>Entregado ✓</option>' +
        '</select>' +
        '<button class="btn-icon" onclick="editTask(\'' + t.id + '\')" title="Editar">✏</button>' +
        '<button class="btn-icon" onclick="deleteTask(\'' + t.id + '\')" title="Eliminar">✕</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function changeStatus(id, val) {
  const t = tasks.find(t=>t.id===id);
  if (t) { t.estado = val; saveTasks(); renderTasks(); }
}

function deleteTask(id) {
  if (!confirm('¿Eliminar esta tarea?')) return;
  tasks = tasks.filter(t=>t.id!==id);
  saveTasks(); renderTasks();
}

function editTask(id) {
  const t = tasks.find(t=>t.id===id);
  if (!t) return;
  editingId = id;
  document.getElementById('f-nombre').value    = t.nombre || '';
  document.getElementById('f-materia').value   = t.materia || '';
  document.getElementById('f-tipo').value      = t.tipo || '';
  document.getElementById('f-fecha').value     = t.fecha || '';
  document.getElementById('f-prioridad').value = t.prioridad || 'media';
  document.getElementById('f-estado').value    = t.estado || 'pendiente';
  document.getElementById('f-bloque').value    = t.bloque || '';
  document.getElementById('f-notas').value     = t.notas || '';
  document.getElementById('modal-title').textContent = 'Editar tarea';
  document.getElementById('modal').classList.add('open');
}

function openModal() {
  editingId = null;
  ['f-nombre','f-materia','f-tipo','f-fecha','f-bloque','f-notas'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('f-prioridad').value = 'media';
  document.getElementById('f-estado').value    = 'pendiente';
  document.getElementById('modal-title').textContent = 'Nueva tarea';
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  editingId = null;
}

function saveTask() {
  const nombre = document.getElementById('f-nombre').value.trim();
  if (!nombre) { alert('El nombre es obligatorio.'); return; }
  const data = {
    nombre,
    materia:   document.getElementById('f-materia').value,
    tipo:      document.getElementById('f-tipo').value,
    fecha:     document.getElementById('f-fecha').value,
    prioridad: document.getElementById('f-prioridad').value,
    estado:    document.getElementById('f-estado').value,
    bloque:    document.getElementById('f-bloque').value,
    notas:     document.getElementById('f-notas').value.trim(),
  };
  if (editingId) {
    const idx = tasks.findIndex(t=>t.id===editingId);
    if (idx > -1) tasks[idx] = { ...tasks[idx], ...data };
  } else {
    tasks.push({ id: uid(), ...data });
  }
  saveTasks(); closeModal(); renderTasks();
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

loadTasks();
renderTasks();
