<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Semana</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

/* ══════════════════════════════════════════
RESET Y VARIABLES
══════════════════════════════════════════ */

- { box-sizing: border-box; margin: 0; padding: 0; }
  body {
  font-family: ‘DM Mono’, monospace;
  min-height: 100vh;
  background: #0f0f0f;
  color: #e8e4dc;
  width: 100%;
  overflow-x: hidden;
  }

/* ══════════════════════════════════════════
NAVEGACIÓN
══════════════════════════════════════════ */
.topnav {
display: flex;
align-items: center;
background: #0a0a0a;
border-bottom: 1px solid #222;
padding: 0 16px;
position: sticky;
top: 0;
z-index: 50;
overflow-x: auto;
}
.app-brand {
font-family: ‘Instrument Serif’, serif;
font-size: 1rem;
color: #e8e4dc;
padding: 16px 0;
margin-right: 20px;
white-space: nowrap;
flex-shrink: 0;
}
.app-brand em { font-style: italic; opacity: 0.5; }
.tab-btn {
background: none;
border: none;
font-family: ‘Instrument Serif’, serif;
font-size: 0.95rem;
color: #555;
padding: 16px 14px;
cursor: pointer;
border-bottom: 2px solid transparent;
transition: color 0.15s, border-color 0.15s;
white-space: nowrap;
flex-shrink: 0;
}
.tab-btn:hover { color: #999; }
.tab-btn.active { color: #e8e4dc; border-bottom-color: #e8e4dc; font-weight: 700; }

/* ══════════════════════════════════════════
PANELS
══════════════════════════════════════════ */
.panel { display: none; width: 100%; }
.panel.active { display: block; width: 100%; }

/* ══════════════════════════════════════════
PANEL HORARIO
══════════════════════════════════════════ */
#panel-horario { background: #0f0f0f; padding: 0 0 60px; }

.smart-banner {
display: flex;
align-items: center;
gap: 12px;
background: #161616;
border-bottom: 1px solid #2a2a2a;
padding: 14px 20px;
flex-wrap: wrap;
}
.smart-left { display: flex; flex-direction: column; gap: 2px; min-width: 70px; }
.smart-day { font-family: ‘Instrument Serif’, serif; font-size: 1rem; font-weight: 700; color: #e8e4dc; }
.smart-time { font-family: ‘DM Mono’, monospace; font-size: 1.3rem; color: #d45c2e; letter-spacing: 0.05em; }
.smart-center { flex: 1; min-width: 140px; }
.smart-phrase { font-family: ‘Instrument Serif’, serif; font-size: 0.95rem; font-style: italic; color: #e8e4dc; margin-bottom: 2px; }
.smart-summary { font-family: ‘DM Mono’, monospace; font-size: 0.6rem; color: #5a5a5a; line-height: 1.5; }
.smart-right { text-align: center; }
.smart-pending {
background: #1e3a2a;
border: 1px solid #2e8b6b;
border-radius: 10px;
padding: 7px 12px;
display: flex; flex-direction: column; align-items: center;
}
.smart-pending span { font-family: ‘Instrument Serif’, serif; font-size: 1.4rem; color: #3dba8a; line-height: 1; }
.smart-pending small { font-family: ‘DM Mono’, monospace; font-size: 0.52rem; color: #2e8b6b; text-transform: uppercase; letter-spacing: 0.1em; }

#panel-horario header { padding: 20px 20px 0; margin-bottom: 18px; }
#panel-horario h1 { font-family: ‘Syne’, sans-serif; font-size: clamp(1.5rem, 5vw, 2.4rem); font-weight: 800; letter-spacing: -0.03em; }
#panel-horario header p { font-size: 0.7rem; color: #5a5a5a; margin-top: 3px; letter-spacing: 0.1em; text-transform: uppercase; }

.legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px; margin-bottom: 18px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.65rem; letter-spacing: 0.07em; text-transform: uppercase; opacity: 0.8; }
.legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

.grid-wrapper { overflow-x: auto; padding: 0 20px; }
.schedule {
display: grid;
grid-template-columns: 52px repeat(7, minmax(90px, 1fr));
min-width: 700px;
border: 1px solid #2a2a2a;
border-radius: 10px;
overflow: hidden;
}
.day-header {
background: #161616;
padding: 10px 6px;
text-align: center;
font-family: ‘Syne’, sans-serif;
font-size: 0.65rem;
font-weight: 700;
letter-spacing: 0.12em;
text-transform: uppercase;
color: #5a5a5a;
border-right: 1px solid #2a2a2a;
border-bottom: 2px solid #333;
}
.day-header.today { color: #e8e4dc !important; background: #1a1814 !important; border-bottom-color: #d45c2e !important; }
.time-label {
padding: 5px 6px 0;
display: flex; align-items: flex-start; justify-content: flex-end;
font-size: 0.58rem; color: #5a5a5a;
border-right: 1px solid #2a2a2a; border-bottom: 1px solid #222;
min-height: 42px; background: #161616;
}
.cell { min-height: 42px; border-right: 1px solid #2a2a2a; border-bottom: 1px solid #222; padding: 3px; }
.cell:last-child { border-right: none; }
.block {
border-radius: 4px; padding: 4px 6px;
font-size: 0.6rem; line-height: 1.3;
height: 100%; display: flex; flex-direction: column; justify-content: center;
cursor: default; transition: filter 0.15s; user-select: none;
}
.block:hover { filter: brightness(1.12); }
.block b { font-family: ‘Syne’, sans-serif; font-weight: 700; font-size: 0.64rem; display: block; margin-bottom: 1px; }
.block span { opacity: 0.8; }
.clase   { background: #1a3a6e; border-left: 3px solid #5b9bf8; color: #a8c8ff; }
.estudio { background: #0f3d2a; border-left: 3px solid #3dba8a; color: #7dddb8; }
.gym     { background: #5a2000; border-left: 3px solid #ff6b2b; color: #ffaa7a; }
.ocio    { background: #3a1a5a; border-left: 3px solid #c070f0; color: #dda8ff; }
.sueno   { background: #1a2a3a; border-left: 3px solid #5a8aaa; color: #8ab8d8; }
.comida  { background: #3a2a00; border-left: 3px solid #d4a020; color: #f0c84a; }
.empty { font-size: 0.52rem; color: #2a2a2a; display: flex; align-items: center; justify-content: center; height: 100%; min-height: 36px; }

/* ══════════════════════════════════════════
PANEL TAREAS
══════════════════════════════════════════ */
#panel-tareas { background: #f5f2ed; color: #1a1814; height: calc(100vh - 57px); overflow: hidden; }
#panel-tareas.active { display: flex; width: 100%; }

.t-sidebar {
width: 130px; flex-shrink: 0;
background: #1a1814; color: #f5f2ed;
padding: 18px 10px;
display: flex; flex-direction: column; gap: 2px;
height: calc(100vh - 57px);
overflow: hidden;
}
.t-sidebar-title { font-family: ‘Instrument Serif’, serif; font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; color: #f5f2ed; line-height: 1.2; }
.t-sidebar-title span { font-style: italic; opacity: 0.45; font-size: 0.65rem; display: block; font-family: ‘DM Mono’, monospace; font-weight: 400; }
.t-section { font-family: ‘Instrument Serif’, serif; font-size: 0.75rem; font-weight: 700; color: #f5f2ed; margin-top: 12px; margin-bottom: 2px; }
.t-filter {
background: none; border: none; color: #888;
font-family: ‘Instrument Serif’, serif; font-size: 0.75rem;
padding: 4px 5px; border-radius: 5px; cursor: pointer;
text-align: left; display: flex; align-items: center; gap: 5px;
transition: all 0.12s; width: 100%;
}
.t-filter:hover { background: #2a2a2a; color: #fff; }
.t-filter.active { background: #f5f2ed; color: #1a1814; font-weight: 700; }
.f-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.f-cnt { margin-left: auto; background: #2a2a2a; color: #666; font-size: 0.55rem; padding: 1px 4px; border-radius: 8px; font-family: ‘DM Mono’, monospace; }
.t-filter.active .f-cnt { background: #e0dbd2; color: #8a8278; }

.t-main { flex: 1; min-width: 0; width: 0; padding: 18px 12px; background: #f5f2ed; height: calc(100vh - 57px); overflow-y: auto; overflow-x: hidden; }
.t-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
.t-topbar h2 { font-family: ‘Instrument Serif’, serif; font-size: 1.4rem; font-weight: 400; color: #1a1814; }
.t-topbar h2 em { font-style: italic; color: #8a8278; }
.btn-new { background: #1a1814; color: #f5f2ed; border: none; font-family: ‘Instrument Serif’, serif; font-size: 0.82rem; padding: 8px 14px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.btn-new:hover { opacity: 0.8; }

.t-stats { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.t-stat { background: #fefcf9; border: 1px solid #e0dbd2; border-radius: 7px; padding: 8px 12px; flex: 1; min-width: 60px; }
.t-stat-num { font-family: ‘Instrument Serif’, serif; font-size: 1.3rem; line-height: 1; color: #1a1814; }
.t-stat-lbl { font-size: 0.55rem; color: #8a8278; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }

.task-list { display: flex; flex-direction: column; gap: 6px; }
.task-card {
background: #fefcf9; border: 1px solid #e0dbd2; border-radius: 8px;
padding: 9px 11px; display: grid; grid-template-columns: 3px 1fr;
gap: 8px; align-items: start; transition: box-shadow 0.12s;
}
.task-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.task-card.entregado { opacity: 0.42; }
.t-accent { border-radius: 2px; align-self: stretch; min-height: 14px; }
.t-body { min-width: 0; }
.t-name { font-family: ‘Instrument Serif’, serif; font-size: 0.92rem; font-weight: 700; line-height: 1.25; margin-bottom: 4px; color: #1a1814; }
.t-meta { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.tag { font-size: 0.55rem; padding: 1px 5px; border-radius: 20px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 500; font-family: ‘DM Mono’, monospace; }
.tag-mat    { background: #f0ebe3; color: #8a8278; }
.tag-tipo   { background: #eef2ff; color: #4f46e5; }
.tag-alta   { background: #fef2f2; color: #dc2626; }
.tag-media  { background: #fffbeb; color: #d97706; }
.tag-baja   { background: #f0fdf4; color: #16a34a; }
.tag-bloque { background: #f5f0e8; color: #92400e; }
.t-date { font-size: 0.58rem; color: #8a8278; margin-top: 3px; font-family: ‘DM Mono’, monospace; }
.t-date.vhoy    { color: #dc2626; font-weight: 500; }
.t-date.vpronto { color: #d97706; }
.t-notes-toggle { background: none; border: none; font-family: ‘DM Mono’, monospace; font-size: 0.58rem; color: #8a8278; cursor: pointer; padding: 2px 0; margin-top: 3px; display: flex; align-items: center; gap: 3px; }
.t-notes-toggle:hover { color: #1a1814; }
.t-notes-body { display: none; margin-top: 6px; padding: 7px 9px; background: #f0ebe3; border-radius: 5px; border-left: 2px solid #c8c2b8; font-size: 0.68rem; color: #1a1814; line-height: 1.65; white-space: pre-wrap; font-family: ‘DM Mono’, monospace; }
.t-notes-body.open { display: block; }
.t-actions { display: flex; flex-direction: row; gap: 5px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.status-sel { font-family: ‘Instrument Serif’, serif; font-size: 0.78rem; border: 1px solid #e0dbd2; border-radius: 5px; padding: 3px 6px; background: #f5f2ed; color: #1a1814; cursor: pointer; flex: 1; min-width: 0; }
.btn-icon { background: none; border: none; color: #c8c2b8; cursor: pointer; font-size: 0.68rem; padding: 2px 3px; border-radius: 3px; }
.btn-icon:hover { color: #1a1814; }
.btn-delete { background: none; border: 1px solid #e0dbd2; font-size: 0.8rem; padding: 2px 6px; border-radius: 5px; cursor: pointer; color: #8a8278; }
.btn-delete:hover { background: #fef2f2; border-color: #dc2626; color: #dc2626; }
.t-empty { text-align: center; padding: 40px 16px; color: #8a8278; }
.t-empty-icon { font-size: 1.8rem; margin-bottom: 8px; }
.t-empty p { font-size: 0.72rem; line-height: 1.6; font-family: ‘DM Mono’, monospace; }

/* ══════════════════════════════════════════
PANEL DIARIO
══════════════════════════════════════════ */
#panel-diario { background: #0f0f0f; min-height: calc(100vh - 57px); padding: 24px 20px 60px; }
.d-container { max-width: 640px; margin: 0 auto; }
.d-composer { background: #161616; border: 1px solid #2a2a2a; border-radius: 12px; padding: 18px; margin-bottom: 24px; }
.d-composer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 4px; }
.d-new-label { font-family: ‘Instrument Serif’, serif; font-size: 1rem; font-weight: 700; color: #e8e4dc; }
.d-timestamp { font-family: ‘DM Mono’, monospace; font-size: 0.6rem; color: #5a5a5a; }
.d-titulo-input { width: 100%; background: none; border: none; border-bottom: 1px solid #2a2a2a; font-family: ‘Instrument Serif’, serif; font-size: 1.05rem; font-weight: 700; color: #e8e4dc; padding: 5px 0 9px; margin-bottom: 10px; outline: none; }
.d-titulo-input::placeholder { color: #333; }
.d-titulo-input:focus { border-bottom-color: #d45c2e; }
.d-texto-input { width: 100%; background: none; border: none; font-family: ‘DM Mono’, monospace; font-size: 0.78rem; color: #c8c2b8; line-height: 1.8; resize: none; min-height: 130px; outline: none; }
.d-texto-input::placeholder { color: #333; }
.d-save-btn { margin-top: 12px; background: #d45c2e; color: #fff; border: none; font-family: ‘Instrument Serif’, serif; font-size: 0.9rem; padding: 9px 20px; border-radius: 7px; cursor: pointer; }
.d-save-btn:hover { opacity: 0.85; }
.d-entries-header { font-family: ‘DM Mono’, monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; color: #5a5a5a; margin-bottom: 12px; }
.d-entries { display: flex; flex-direction: column; gap: 10px; }
.d-entry { background: #161616; border: 1px solid #2a2a2a; border-radius: 10px; padding: 14px 16px; position: relative; }
.d-entry:hover { border-color: #444; }
.d-entry-date { font-family: ‘DM Mono’, monospace; font-size: 0.58rem; color: #5a5a5a; letter-spacing: 0.08em; margin-bottom: 5px; }
.d-entry-title { font-family: ‘Instrument Serif’, serif; font-size: 0.98rem; font-weight: 700; color: #e8e4dc; margin-bottom: 5px; }
.d-entry-text { font-family: ‘DM Mono’, monospace; font-size: 0.72rem; color: #8a8480; line-height: 1.7; white-space: pre-wrap; }
.d-entry-del { position: absolute; top: 10px; right: 12px; background: none; border: none; color: #333; cursor: pointer; font-size: 0.78rem; }
.d-entry-del:hover { color: #dc2626; }

/* ══════════════════════════════════════════
MODAL
══════════════════════════════════════════ */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: #fefcf9; color: #1a1814; border-radius: 12px; padding: 22px; width: 100%; max-width: 460px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); max-height: 90vh; overflow-y: auto; animation: slideUp 0.18s ease; }
@keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal h3 { font-family: ‘Instrument Serif’, serif; font-size: 1.2rem; margin-bottom: 16px; }
.fg { margin-bottom: 11px; }
.fg label { display: block; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: #8a8278; margin-bottom: 4px; }
.fg input, .fg select, .fg textarea { width: 100%; font-family: ‘DM Mono’, monospace; font-size: 0.76rem; border: 1px solid #e0dbd2; border-radius: 6px; padding: 8px 10px; background: #f5f2ed; color: #1a1814; outline: none; }
.fg input:focus, .fg select:focus, .fg textarea:focus { border-color: #1a1814; }
.fg textarea { resize: vertical; min-height: 110px; font-size: 0.8rem; line-height: 1.7; }
.fg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.btn-cancel { background: none; border: 1px solid #e0dbd2; font-family: ‘DM Mono’, monospace; font-size: 0.7rem; padding: 8px 14px; border-radius: 6px; cursor: pointer; color: #8a8278; }
.btn-save { background: #1a1814; color: #f5f2ed; border: none; font-family: ‘DM Mono’, monospace; font-size: 0.7rem; padding: 8px 18px; border-radius: 6px; cursor: pointer; }

</style>
</head>
<body>

<nav class="topnav">
  <div class="app-brand">Mi <em>semana</em></div>
  <button class="tab-btn active" onclick="showTab('horario',this)">📅 Horario</button>
  <button class="tab-btn" onclick="showTab('tareas',this)">📋 Tareas</button>
  <button class="tab-btn" onclick="showTab('diario',this)">📓 Diario</button>
</nav>

<!-- HORARIO -->

<div class="panel active" id="panel-horario">
  <div class="smart-banner">
    <div class="smart-left">
      <div class="smart-day" id="smart-day">—</div>
      <div class="smart-time" id="smart-time">—</div>
    </div>
    <div class="smart-center">
      <div class="smart-phrase" id="smart-phrase">—</div>
      <div class="smart-summary" id="smart-summary">—</div>
    </div>
    <div class="smart-right">
      <div class="smart-pending">
        <span id="smart-count">0</span>
        <small>pendientes</small>
      </div>
    </div>
  </div>
  <header>
    <h1>Horario Semanal</h1>
    <p>Semestre activo</p>
  </header>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#3b6fd4"></div> Clases</div>
    <div class="legend-item"><div class="legend-dot" style="background:#2e8b6b"></div> Estudio</div>
    <div class="legend-item"><div class="legend-dot" style="background:#d45c2e"></div> Gimnasio</div>
    <div class="legend-item"><div class="legend-dot" style="background:#9b59b6"></div> Ocio</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4a6480"></div> Sueño</div>
    <div class="legend-item"><div class="legend-dot" style="background:#b8860b"></div> Comidas</div>
  </div>
  <div class="grid-wrapper">
    <div class="schedule" id="schedule">
      <div class="day-header">hora</div>
      <div class="day-header">lun</div>
      <div class="day-header">mar</div>
      <div class="day-header">mié</div>
      <div class="day-header">jue</div>
      <div class="day-header">vie</div>
      <div class="day-header">sáb</div>
      <div class="day-header">dom</div>
    </div>
  </div>
</div>

<!-- TAREAS -->

<div class="panel" id="panel-tareas">
  <aside class="t-sidebar">
    <div class="t-sidebar-title">Tareas <span>académicas</span></div>
    <div class="t-section">Vista</div>
    <button class="t-filter active" onclick="setFilter('all',this)">
      <span class="f-dot" style="background:#888"></span>Todas
      <span class="f-cnt" id="cnt-all">0</span>
    </button>
    <button class="t-filter" onclick="setFilter('esta-semana',this)">
      <span class="f-dot" style="background:#f59e0b"></span>Semana
      <span class="f-cnt" id="cnt-semana">0</span>
    </button>
    <button class="t-filter" onclick="setFilter('pendiente',this)">
      <span class="f-dot" style="background:#64748b"></span>Por hacer
      <span class="f-cnt" id="cnt-pendiente">0</span>
    </button>
    <button class="t-filter" onclick="setFilter('en-progreso',this)">
      <span class="f-dot" style="background:#2563eb"></span>Progreso
      <span class="f-cnt" id="cnt-progreso">0</span>
    </button>
    <button class="t-filter" onclick="setFilter('entregado',this)">
      <span class="f-dot" style="background:#16a34a"></span>Entregados
      <span class="f-cnt" id="cnt-entregado">0</span>
    </button>
    <div class="t-section">Materias</div>
    <button class="t-filter" onclick="setFilter('Inglés',this)">
      <span class="f-dot" style="background:#2563a8"></span>Inglés
      <span class="f-cnt" id="cnt-Inglés">0</span>
    </button>
    <button class="t-filter" onclick="setFilter('Métodos de Estudio',this)">
      <span class="f-dot" style="background:#16794a"></span>Métodos
      <span class="f-cnt" id="cnt-Métodos de Estudio">0</span>
    </button>
    <button class="t-filter" onclick="setFilter('F.J. de Caldas',this)">
      <span class="f-dot" style="background:#a05c1a"></span>F.J. Caldas
      <span class="f-cnt" id="cnt-F.J. de Caldas">0</span>
    </button>
    <button class="t-filter" onclick="setFilter('Teoría del Lenguaje',this)">
      <span class="f-dot" style="background:#7c2d8f"></span>Teoría Leng.
      <span class="f-cnt" id="cnt-Teoría del Lenguaje">0</span>
    </button>
    <button class="t-filter" onclick="setFilter('Política y Ciudadanía',this)">
      <span class="f-dot" style="background:#b91c3a"></span>Política
      <span class="f-cnt" id="cnt-Política y Ciudadanía">0</span>
    </button>
    <button class="t-filter" onclick="setFilter('Oralidad',this)">
      <span class="f-dot" style="background:#0e7490"></span>Oralidad

(function buildSchedule() {
  const lookup = {};
  blocks.forEach(b => { lookup[b.day + '-' + b.hour] = b; });
  const sched = document.getElementById('schedule');
  for (let hr = 5; hr <= 23; hr++) {
    const tl = document.createElement('div');
    tl.className = 'time-label';
    tl.textContent = hr.toString().padStart(2,'0') + ':00';
    sched.appendChild(tl);
    for (let d = 0; d < 7; d++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const b = lookup[d + '-' + hr];
      if (b) {
        const bl = document.createElement('div');
        bl.className = 'block ' + b.type;
        bl.innerHTML = '<b>' + b.label + '</b>' + (b.sub ? '<span>' + b.sub + '</span>' : '');
        cell.appendChild(bl);
      } else {
        const ph = document.createElement('div');
        ph.className = 'empty';
        ph.textContent = '·';
        cell.appendChild(ph);
      }
      sched.appendChild(cell);
    }
  }
})();

// TAREAS
// ══════════════════════════════════════════
function loadTasks() {
  try { tasks = JSON.parse(localStorage.getItem(TASK_KEY)) || []; } catch { tasks = []; }
}
function saveTasks() {
  try { localStorage.setItem(TASK_KEY, JSON.stringify(tasks)); } catch {}
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.t-filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const titles = { all:'Todas las <em>tareas</em>','esta-semana':'Esta <em>semana</em>',pendiente:'Por <em>hacer</em>','en-progreso':'En <em>progreso</em>',entregado:'<em>Entregadas</em>' };
  document.getElementById('view-title').innerHTML = titles[f] || '<em>' + f + '</em>';
  renderTasks();
}

function filterTasks() {
  const now = new Date(); now.setHours(0,0,0,0);
  const we  = new Date(now); we.setDate(we.getDate() + 7);
  return tasks.filter(t => {
    if (currentFilter === 'all')         return true;
    if (currentFilter === 'pendiente')   return t.estado === 'pendiente';
    if (currentFilter === 'en-progreso') return t.estado === 'en-progreso';
    if (currentFilter === 'entregado')   return t.estado === 'entregado';
    if (currentFilter === 'esta-semana') {
      if (!t.fecha) return false;
      const d = new Date(t.fecha + 'T00:00:00');
      return d >= now && d <= we;
    }
    return t.materia === currentFilter;
  }).sort((a,b) => {
    if (!a.fecha && !b.fecha) return 0;
    if (!a.fecha) return 1; if (!b.fecha) return -1;
    return new Date(a.fecha) - new Date(b.fecha);
  });
}

function dateLabel(f) {
  if (!f) return null;
  const now  = new Date(); now.setHours(0,0,0,0);
  const d    = new Date(f + 'T00:00:00');
  const diff = Math.round((d - now) / 86400000);
  const fmt  = d.toLocaleDateString('es-CO', { day:'numeric', month:'short', year:'numeric' });
  if (diff < 0)  return { text:'Venció el ' + fmt, cls:'vhoy' };
  if (diff === 0) return { text:'⚠ Vence hoy', cls:'vhoy' };
  if (diff === 1) return { text:'⚡ Vence mañana', cls:'vpronto' };
  if (diff <= 5)  return { text:'Vence en ' + diff + ' días — ' + fmt, cls:'vpronto' };
  return { text:'Entrega: ' + fmt, cls:'' };
}

function renderTasks() {
  const now = new Date(); now.setHours(0,0,0,0);
  const we  = new Date(now); we.setDate(we.getDate() + 7);
  document.getElementById('s-total').textContent = tasks.length;
  document.getElementById('s-pend').textContent  = tasks.filter(t => t.estado === 'pendiente').length;
  document.getElementById('s-prog').textContent  = tasks.filter(t => t.estado === 'en-progreso').length;
  document.getElementById('s-ent').textContent   = tasks.filter(t => t.estado === 'entregado').length;
  document.getElementById('cnt-all').textContent       = tasks.length;
  document.getElementById('cnt-semana').textContent    = tasks.filter(t => { if (!t.fecha) return false; const d = new Date(t.fecha+'T00:00:00'); return d>=now&&d<=we; }).length;
  document.getElementById('cnt-pendiente').textContent = tasks.filter(t => t.estado==='pendiente').length;
  document.getElementById('cnt-progreso').textContent  = tasks.filter(t => t.estado==='en-progreso').length;
  document.getElementById('cnt-entregado').textContent = tasks.filter(t => t.estado==='entregado').length;
  Object.keys(MATERIA_COLORS).forEach(m => { const el = document.getElementById('cnt-'+m); if(el) el.textContent = tasks.filter(t=>t.materia===m).length; });

  const list     = document.getElementById('task-list');
  const filtered = filterTasks();
  if (!filtered.length) {
    list.innerHTML = '<div class="t-empty"><div class="t-empty-icon">📭</div><p>No hay tareas aquí.<br>Usa <strong>+ Nueva tarea</strong> para agregar.</p></div>';
    updateBanner(); return;
  }
  list.innerHTML = filtered.map(t => {
    const color    = MATERIA_COLORS[t.materia] || '#888';
    const dl       = dateLabel(t.fecha);
    const hasNotes = t.notas && t.notas.trim().length > 0;
    return '<div class="task-card ' + (t.estado==='entregado'?'entregado':'') + '" id="card-' + t.id + '">' +
      '<div class="t-accent" style="background:' + color + '"></div>' +
      '<div class="t-body">' +
        '<div class="t-name">' + t.nombre + '</div>' +
        '<div class="t-meta">' +
          (t.materia   ? '<span class="tag tag-mat">'  + t.materia + '</span>' : '') +
          (t.tipo      ? '<span class="tag tag-tipo">' + t.tipo    + '</span>' : '') +
          (t.prioridad ? '<span class="tag tag-' + t.prioridad + '">' + (t.prioridad==='alta'?'🔴 Alta':t.prioridad==='media'?'🟡 Media':'🟢 Baja') + '</span>' : '') +
          (t.bloque    ? '<span class="tag tag-bloque">' + t.bloque + '</span>' : '') +
        '</div>' +
        (dl ? '<div class="t-date ' + dl.cls + '">' + dl.text + '</div>' : '') +
        (hasNotes ? '<button class="t-notes-toggle" onclick="toggleNotes(\'' + t.id + '\',this)"><span>▶</span> Ver detalles</button><div class="t-notes-body" id="notes-' + t.id + '">' + t.notas + '</div>' : '') +
        '<div class="t-actions">' +
          '<select class="status-sel" onchange="changeStatus(\'' + t.id + '\',this.value)">' +
            '<option value="pendiente"'   + (t.estado==='pendiente'  ?' selected':'') + '>Por hacer</option>' +
            '<option value="en-progreso"' + (t.estado==='en-progreso'?' selected':'') + '>En progreso</option>' +
            '<option value="entregado"'   + (t.estado==='entregado'  ?' selected':'') + '>Entregado ✓</option>' +
          '</select>' +
          '<button class="btn-icon" onclick="editTask(\'' + t.id + '\')" title="Editar">✏</button>' +
          '<button class="btn-delete" id="del-' + t.id + '" onclick="deleteTask(\'' + t.id + '\')">🗑</button>' +
        '</div>' +
      '</div></div>';
  }).join('');
  updateBanner();
}

function toggleNotes(id, btn) {
  const body = document.getElementById('notes-' + id);
  const open = body.classList.toggle('open');
  btn.querySelector('span').textContent = open ? '▼' : '▶';
  btn.lastChild.textContent = open ? ' Ocultar detalles' : ' Ver detalles';
}
function changeStatus(id, val) {
  const t = tasks.find(t => t.id === id);
  if (t) { t.estado = val; saveTasks(); renderTasks(); }
}
function deleteTask(id) {
  if (!confirm('¿Eliminar esta tarea?')) return;
  tasks = tasks.filter(t => t.id !== id);
  saveTasks(); renderTasks();
}
function openModal() {
  editingId = null;
  ['f-nombre','f-materia','f-tipo','f-fecha','f-bloque','f-notas'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('f-prioridad').value = 'media';
  document.getElementById('f-estado').value    = 'pendiente';
  document.getElementById('modal-title').textContent = 'Nueva tarea';
  document.getElementById('modal').classList.add('open');
}
function editTask(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  editingId = id;
  document.getElementById('f-nombre').value    = t.nombre    || '';
  document.getElementById('f-materia').value   = t.materia   || '';
  document.getElementById('f-tipo').value      = t.tipo      || '';
  document.getElementById('f-fecha').value     = t.fecha     || '';
  document.getElementById('f-prioridad').value = t.prioridad || 'media';
  document.getElementById('f-estado').value    = t.estado    || 'pendiente';
  document.getElementById('f-bloque').value    = t.bloque    || '';
  document.getElementById('f-notas').value     = t.notas     || '';
  document.getElementById('modal-title').textContent = 'Editar tarea';
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  editingId = null;
}
function saveTask() {
  const nombre = document.getElementById('f-nombre').value.trim();
  if (!nombre) { alert('El nombre es obligatorio.'); return; }
  const data = {
    nombre,
    materia:   document.getElementById('f-materia').value,
    tipo:      document.getElementById('f-tipo').value,
    fecha:     document.getElementById('f-fecha').value,
    prioridad: document.getElementById('f-prioridad').value,
    estado:    document.getElementById('f-estado').value,
    bloque:    document.getElementById('f-bloque').value,
    notas:     document.getElementById('f-notas').value.trim(),
  };
  if (editingId) {
    const idx = tasks.findIndex(t => t.id === editingId);
    if (idx > -1) tasks[idx] = { ...tasks[idx], ...data };
  } else {
    tasks.push({ id: uid(), ...data });
  }
  saveTasks(); closeModal(); renderTasks();
}
document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

// ══════════════════════════════════════════
// DIARIO
// ══════════════════════════════════════════
function loadDiary() {
  try { diaryEntries = JSON.parse(localStorage.getItem(DIARY_KEY)) || []; } catch { diaryEntries = []; }
}
function saveDiary() {
  try { localStorage.setItem(DIARY_KEY, JSON.stringify(diaryEntries)); } catch {}
}
function updateDiaryTimestamp() {
  const now   = new Date();
  const dias  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const hrs   = now.getHours().toString().padStart(2,'0');
  const mins  = now.getMinutes().toString().padStart(2,'0');
  const el = document.getElementById('d-timestamp');
  if (el) el.textContent = dias[now.getDay()] + ', ' + now.getDate() + ' ' + meses[now.getMonth()] + '. ' + now.getFullYear() + ' · ' + hrs + ':' + mins;
}
function formatEntryDate(ts) {
  const d     = new Date(ts);
  const dias  = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return dias[d.getDay()] + ' ' + d.getDate() + ' de ' + meses[d.getMonth()] + ' de ' + d.getFullYear() + ' · ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function saveDiaryEntry() {
  const titulo = document.getElementById('d-titulo').value.trim();
  const texto  = document.getElementById('d-texto').value.trim();
  if (!texto) { alert('Escribe algo antes de guardar.'); return; }
  diaryEntries.unshift({ id: uid(), titulo, texto, ts: Date.now() });
  saveDiary();
  document.getElementById('d-titulo').value = '';
  document.getElementById('d-texto').value  = '';
  renderDiary();
}
function deleteDiaryEntry(id) {
  diaryEntries = diaryEntries.filter(e => e.id !== id);
  saveDiary(); renderDiary();
}
function renderDiary() {
  const container  = document.getElementById('d-entries');
  const countLabel = document.getElementById('d-count-label');
  if (!container) return;
  countLabel.textContent = diaryEntries.length === 0 ? 'Sin entradas aún' : diaryEntries.length + ' entrada' + (diaryEntries.length > 1 ? 's' : '');
  if (!diaryEntries.length) {
    container.innerHTML = '<div style="text-align:center;padding:36px 0;color:#3a3a3a;font-family:\'DM Mono\',monospace;font-size:0.7rem;">Tus pensamientos aparecerán aquí.</div>';
    return;
  }
  container.innerHTML = diaryEntries.map(e =>
    '<div class="d-entry">' +
      '<button class="d-entry-del" onclick="deleteDiaryEntry(\'' + e.id + '\')">🗑</button>' +
      '<div class="d-entry-date">' + formatEntryDate(e.ts) + '</div>' +
      (e.titulo ? '<div class="d-entry-title">' + e.titulo + '</div>' : '') +
      '<div class="d-entry-text">' + e.texto + '</div>' +
    '</div>'
  ).join('');
}

// ══════════════════════════════════════════
// INICIALIZACIÓN
// ══════════════════════════════════════════
loadTasks();
renderTasks();
loadDiary();
renderDiary();
updateBanner();
updateDiaryTimestamp();
setInterval(updateBanner, 60000);
setInterval(updateDiaryTimestamp, 30000);
</script>
